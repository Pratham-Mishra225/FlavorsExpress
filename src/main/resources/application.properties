spring.application.name=FDS

# ==========================
# ENVIRONMENT IMPORT (Dotenv support)
# ==========================
spring.config.import=optional:file:.env

# ==========================
# DATABASE CONFIGURATION
# ==========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================
# JPA / HIBERNATE CONFIGURATION
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================
# LOGGING CONFIGURATION
# ==========================
# Root logging level
logging.level.root=INFO

# Application logging level
logging.level.com.pratham.FDS=DEBUG

# Spring Framework logging levels
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# Hibernate/SQL logging levels
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Logging pattern for Console
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}

# File logging
logging.file.name=logs/fds-app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.total-size-cap=100MB
logging.logback.rollingpolicy.max-history=7

# ==========================
# SERVER CONFIGURATION
# ==========================
server.port=${SERVER_PORT:8080}

# ==========================
# JWT CONFIGURATION
# ==========================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================
# CORS CONFIGURATION
# ==========================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}