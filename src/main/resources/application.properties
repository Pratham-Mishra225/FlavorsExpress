spring.application.name=FDS

# Server Configuration
server.port=${SERVER_PORT:8080}

# ==============================================================================
# Database Configuration (MySQL)
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/food_delivery_db?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# JPA / Hibernate Configuration
# ==============================================================================
# Development setting: update existing schema without dropping existing records
spring.jpa.hibernate.ddl-auto=update
# Development setting: log and format SQL statements
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================================================================
# Security / JWT Configuration
# ==============================================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==============================================================================
# CORS Configuration
# ==============================================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ==============================================================================
# Environment Configuration Support (.env loader)
# ==============================================================================
context.initializer.classes=com.pratham.FDS.config.DotenvInitializer
